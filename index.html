const SC={New:'#2563eb',Confirmed:'#7c3aed','In production':'#d97706',Shipped:'#0891b2',Delivered:'#16a34a',Cancelled:'#dc2626',Replacement:'#db2777'};
V.orders=()=>{const all=[...D.orders].sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)),q=OQ.toLowerCase(),o=all.filter(x=>(OF=='All'||x.status==OF)&&(!q||(x.id+(x.customer?.name||'')+(x.customer?.phone||'')).toLowerCase().includes(q))),rev=all.filter(x=>x.payment?.status=='Paid').reduce((a,b)=>a+b.total,0);
return`<div class="st"><div><b>${all.length}</b>Orders</div><div><b>${all.filter(x=>x.status=='New').length}</b>New</div><div><b>${all.filter(x=>['Confirmed','In production'].includes(x.status)).length}</b>In progress</div><div><b>${m(rev)}</b>Paid revenue</div></div><div class="chs">${['All',...OS].map(t=>`<button class="ch ${t==OF?'on':''}" data-a="of" data-v="${t}">${t}<i>${t=='All'?all.length:all.filter(x=>x.status==t).length}</i></button>`).join('')}</div><input id="oq" placeholder="Search order ID, name or phone" value="${esc(OQ)}">`+(o.map(x=>`<div class="oc2"><div class="oh"><b>#${x.id.slice(0,6)}</b><span class="bd" style="background:${SC[x.status]||'#555'}">${esc(x.status)}</span><span class="dt">${x.createdAt?new Date(x.createdAt.seconds*1000).toLocaleString():''}</span><b>${m(x.total)}</b></div><div class="ob"><div><h6>Customer</h6><p><b>${esc(x.customer?.name)}</b><br><a href="tel:${esc(x.customer?.phone)}">${esc(x.customer?.phone)}</a><br>${addr(x.customer)}</p></div><div><h6>Items</h6><p>${(x.items||[]).map(i=>`${i.img?`<img src="${i.img}" style="width:28px;height:34px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:6px">`:''}${esc(i.name)} (${esc(i.color)}/${esc(i.size)}) ×${+i.q}${i.pre?' <span class="bd" style="background:#e8a200">PRE-ORDER</span>':''}`).join('<br>')}</p></div><div><h6>Payment</h6><p>${esc(x.payment?.method)} · ${esc(x.payment?.status)}${x.payment?.ref?'<br>Ref: '+esc(x.payment.ref):''}<br>Subtotal ${m(x.subtotal)}${x.coupon?'<br>Coupon '+esc(x.coupon)+' (−'+m(x.discount)+')':''}<br>Shipping ${m(x.shipping)}</p></div></div><div class="of"><label>Status ${sel('',x.status,OS,`data-o="${x.id}" data-f="status"`)}</label><label>Payment ${sel('',x.payment?.status,PS,`data-o="${x.id}" data-f="pay"`)}</label><span class="sp"></span><button class="b" data-a="wa" data-id="${x.id}">📲 WhatsApp</button><button class="g" data-a="del" data-c="orders" data-id="${x.id}">Delete</button></div></div>`).join('')||'<p>No orders match.</p>')};
V.chats=()=>{if(cc){const c=D.chats.find(x=>x.id==cc)||{};return`<button class="g" data-a="back">‹ Back</button> <b>${esc(c.name)}</b> ${c.phone?`<a class="g" href="https://wa.me/${wa(c.phone)}" target="_blank">WhatsApp</a>`:''}<div id="cm" class="c" style="height:55vh;overflow:auto;margin-top:10px"></div><div class="r"><input id="rp" style="flex:1" placeholder="Reply…"><button class="b" data-a="reply">Send</button></div>`}
return[...D.chats].sort((a,b)=>(b.lastAt?.seconds||0)-(a.lastAt?.seconds||0)).map(c=>`<div class="c r" data-a="chat" data-id="${c.id}" style="cursor:pointer"><span><b>${esc(c.name||'Guest')}</b>${c.unread?' <b style="color:#e33">●</b>':''}<br>${esc(c.last)}</span><span>${c.lastAt?new Date(c.lastAt.seconds*1000).toLocaleString():''}</span></div>`).join('')||'<p>No chats yet. Customer messages from the store Help button appear here.</p>'};
const RM=()=>{const b=$('#cm');if(!b)return;b.innerHTML=MS.map(x=>`<div style="margin:6px 0;text-align:${x.from=='admin'?'right':'left'}"><span style="display:inline-block;padding:8px 12px;border-radius:14px;background:${x.from=='admin'?'#000':'#eee'};color:${x.from=='admin'?'#fff':'#111'};max-width:80%;text-align:left">${x.img?`<img src="${x.img}" style="max-width:100%;border-radius:10px;display:block;margin-bottom:4px">`:''}${esc(x.text)}</span><button class="g" data-a="dmsg" data-id="${x.id}" style="margin:0 6px;padding:2px 7px">✕</button></div>`).join('');b.scrollTop=b.scrollHeight};
Object.keys(S).forEach(c=>V[c]=()=>`<button class="b" data-a="new" data-c="${c}">+ Add ${c.slice(0,-1)}</button><br><br>`+D[c].map(x=>`<div class="c r"><span class="th">${(x.images||[x.image]).filter(Boolean).map(i=>`<img src="${i}">`).join('')}</span><span style="flex:1"><b>${x.name||x.title||x.code}</b><br>${c=='products'?m(x.price)+' · stock '+(x.stock??'-')+(x.preorder?' · PRE-ORDER':'')+(x.bestseller?' · ★ Best seller':''):c=='coupons'?x.type+' '+x.value+' · min '+(x.min||0):c=='offers'?x.percent+'% off '+(x.category||'all'):x.place}${x.active===false?' · OFF':''}</span><button class="g" data-a="edit" data-c="${c}" data-id="${x.id}">Edit</button><button class="g" data-a="del" data-c="${c}" data-id="${x.id}">Delete</button></div>`).join(''));
const M=()=>`<div class="mo"><div><h3>${ed.id?'Edit':'New'} ${ed.c.slice(0,-1)}</h3><br>${S[ed.c].map(([k,t,x])=>{const v=ed.d[k];return`<label>${k}</label>`+(t=='area'?`<textarea data-k="${k}" data-t="${t}">${v||''}</textarea>`:t=='select'?sel('',v,x,`data-k="${k}"`):t=='check0'?`<br><input type="checkbox" data-k="${k}" data-t="check" ${v===true?'checked':''}><br>`:t=='check'?`<br><input type="checkbox" data-k="${k}" data-t="check" ${v!==false?'checked':''}><br>`:t=='img'||t=='img1'?`<div class="th">${[].concat(v||[]).map((i,n)=>`<img src="${i}" data-a="rmimg" data-k="${k}" data-n="${n}" title="tap to remove">`).join('')}</div><small style="display:block;color:#888">Recommended: 800 × 1000 px (4:5 portrait), JPG/PNG</small><input type="file" accept="image/*" ${t=='img'?'multiple':''} data-k="${k}" data-t="${t}">`:`<input data-k="${k}" data-t="${t||'text'}" placeholder="${x||''}" type="${t=='number'?'number':'text'}" value="${t=='list'?(v||[]).join(','):v??''}">`)}).join('')}<div class="r"><button class="g" data-a="close">Cancel</button><button class="b" data-a="save">Save</button></div></div></div>`;
function R(){const a=$('#app');if(!user){LH='';a.innerHTML=`<form class="login" data-a="login"><img src="${LOGO}" alt="MY.RP"><p class="sub">ADMIN DASHBOARD</p><label>Password</label><input id="p" type="password" autocomplete="current-password" autofocus><div id="le"></div><button class="b" id="lb">LOG IN</button></form>`;return}
const H=`<header><img src="${LOGO}" alt="MY.RP"><button data-a="out">LOGOUT</button></header><nav>${['orders','chats','payments','products','banner','reviews','subscribers','coupons','offers','settings'].map(t=>`<a data-a="tab" data-t="${t}" class="${t==tab?'on':''}">${t}${t=='chats'&&D.chats.some(c=>c.unread)?' <b style="color:#e33">●</b>':''}</a>`).join('')}</nav><main>${ERR?`<div class="c" style="color:#c00">${ERR=='permission-denied'?'Firestore rules are blocking access. Publish the rules in Firebase → Firestore → Rules.':ERR}</div>`:''}${V[tab]()}</main>${ed?M():''}`;if(H!==LH){const y=scrollY;a.innerHTML=H;LH=H;scrollTo(0,y)}if(tab=='chats'&&cc)RM()}
const A={dmsg:async d=>{if(confirm('Delete message?'))await deleteDoc(doc(db,'chats',cc,'msgs',d.id))},of:d=>{OF=d.v;R()},wa:d=>{const x=D.orders.find(o=>o.id==d.id),t=`Hi ${x.customer?.name||''}, update on your MY.RP order #${x.id.slice(0,6)}:\nStatus: ${x.status}\nPayment: ${x.payment?.status} (${x.payment?.method})\nTotal: ${m(x.total)}\nThank you for choosing MY.RP - Make Your Rare Piece.`;window.open('https://wa.me/'+wa(x.customer?.phone)+'?text='+encodeURIComponent(t),'_blank')},
chat:d=>{cc=d.id;MS=[];unM&&unM();unM=onSnapshot(query(collection(db,'chats',cc,'msgs'),orderBy('createdAt')),s=>{MS=s.docs.map(x=>({id:x.id,...x.data()}));RM()});setDoc(doc(db,'chats',cc),{unread:false},{merge:true});R()},
back:()=>{cc=null;unM&&unM();unM=null;R()},
reply:async()=>{const t=$('#rp').value.trim();if(!t)return;$('#rp').value='';await addDoc(collection(db,'chats',cc,'msgs'),{from:'admin',text:t,createdAt:serverTimestamp()});await setDoc(doc(db,'chats',cc),{last:'You: '+t,lastAt:serverTimestamp(),unread:false},{merge:true})},
tab:d=>{tab=d.t;cc=null;unM&&unM();unM=null;R()},out:()=>signOut(au),close:()=>{ed=null;R()},new:d=>{ed={c:d.c,d:{active:true}};R()},edit:d=>{const x=D[d.c].find(y=>y.id==d.id);ed={c:d.c,id:d.id,d:{...x}};R()},
del:async d=>{if(confirm('Delete?'))await deleteDoc(doc(db,d.c,d.id))},
rmimg:d=>{const v=ed.d[d.k];Array.isArray(v)?v.splice(d.n,1):delete ed.d[d.k];R()},
save:async()=>{const{id,c,d}=ed;delete d.id;try{id?await setDoc(doc(db,c,id),d):await addDoc(collection(db,c),d);ed=null;R()}catch(e){alert(e.message)}},
herodel:async d=>{await setDoc(doc(db,'settings','banner'),{[d.k]:''},{merge:true})},savetexts:async()=>{const g=k=>$('#'+k).value.trim();await setDoc(doc(db,'settings','banner'),{title:g('b_title'),btnText:g('b_btnText'),link:g('hl'),big:g('b_big'),sub:g('b_sub')},{merge:true});alert('Saved')},savesec:async()=>{const g=k=>$('#'+k).value.trim();await setDoc(doc(db,'settings','banner'),{sec1:g('b_sec1'),sec2:g('b_sec2')},{merge:true});alert('Saved')},savecol:async()=>{const g=k=>$('#'+k).value.trim();try{await setDoc(doc(db,'settings','collection'),{title:g('c_title'),desc:g('c_desc')},{merge:true});alert('Saved')}catch(e){alert(e.message)}},coldel:async d=>{await setDoc(doc(db,'settings','collection'),{[d.k]:''},{merge:true})},
saveset:async()=>{const g=k=>$('#s_'+k).value.trim();await setDoc(doc(db,'settings','store'),{razorpay:g('razorpay'),fnUrl:g('fnUrl'),upi:g('upi'),whatsapp:g('whatsapp'),instagram:g('instagram'),facebook:g('facebook'),twitter:g('twitter'),youtube:g('youtube'),shipping:+g('shipping'),freeAbove:+g('freeAbove')},{merge:true});alert('Saved')}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset)});
document.addEventListener('input',e=>{if(e.target.id=='oq'){OQ=e.target.value;R();const n=$('#oq');n.focus();n.setSelectionRange(OQ.length,OQ.length)}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='rp')A.reply()});
document.addEventListener('submit',async e=>{e.preventDefault();const b=$('#lb'),le=$('#le');b.disabled=true;b.textContent='SIGNING IN…';le.textContent='';try{await Promise.race([signInWithEmailAndPassword(au,ADMIN_EMAIL,$('#p').value),new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),15000))])}catch(x){const H={'timeout':'No response from Firebase. Open this page from your hosted https link in Chrome (not a file or in-app preview) and check your internet.','auth/invalid-credential':'Wrong password.','auth/invalid-email':'Enter a valid email.','auth/operation-not-allowed':'Enable Email/Password in Firebase → Authentication → Sign-in method.','auth/unauthorized-domain':'Add this website domain in Firebase → Authentication → Settings → Authorized domains.','auth/network-request-failed':'Network error. Open the page over https, not as a local file.','auth/too-many-requests':'Too many attempts. Try again later.'};b.disabled=false;b.textContent='LOG IN';le.textContent=H[x.code]||x.code||x.message}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k||!ed||t.type=='file')return;const y=t.dataset.t;ed.d[k]=y=='number'?+t.value:y=='check'?t.checked:y=='list'?t.value.split(',').map(s=>s.trim()).filter(Boolean):t.value});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset.o){const x=D.orders.find(o=>o.id==t.dataset.o);await setDoc(doc(db,'orders',x.id),t.dataset.f=='pay'?{...x,payment:{...x.payment,status:t.value}}:{...x,status:t.value});return}
if(t.dataset.hero&&t.files[0]){const k=t.dataset.hero;try{let q=.8,im;do{im=await up(t.files[0],k=='mobile'?1080:1920,q);q-=.1}while(im.length>420000&&q>.35);await setDoc(doc(db,'settings','banner'),{[k]:im},{merge:true});alert('Banner updated')}catch(x){alert(x.message)}t.value='';return}
if(t.dataset.col&&t.files[0]){const k=t.dataset.col;try{let q=.8,im;do{im=await up(t.files[0],900,q);q-=.1}while(im.length>380000&&q>.35);await setDoc(doc(db,'settings','collection'),{[k]:im},{merge:true});alert('Image updated')}catch(x){alert(x.message)}t.value='';return}
if(t.type=='file'&&ed){const k=t.dataset.k,u=[];for(const f of t.files)u.push(await up(f));ed.d[k]=t.dataset.t=='img'?[...(ed.d[k]||[]),...u]:u[0];R()}
else if(t.tagName=='SELECT'&&t.dataset.k&&ed)ed.d[t.dataset.k]=t.value});
</script></body></html>

*{box-sizing:border-box;margin:0}body{font:13px Poppins,system-ui,sans-serif;background:#ececec;color:#111}
header{background:#fff;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;padding:14px 20px}header img{height:34px}header button{background:#000;color:#fff;border:0;border-radius:20px;padding:8px 16px;font-size:10px;letter-spacing:2px}

button,select,input,textarea{font:inherit}.b{background:#000;color:#fff;border:0;border-radius:6px;padding:8px 14px}.g{background:#eee;border:0;border-radius:6px;padding:6px 10px}
